name: test

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set Up LLVM
      uses: ./.github/actions/setup-llvm

    - name: Run Test with Coverage
      run: make coverage

    - name: Run Native Tests with ASan and UBSan
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        make sanitizers

    - name: Run Parser Variants with ASan and UBSan
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        variants="scalar"
        case "$(uname -m)" in
          x86_64|amd64) variants="$variants sse2 sse42" ;;
        esac
        for variant in $variants; do
          case "$variant" in
            scalar) flags='-DHWIRE_NO_SIMD' ;;
            sse2) flags='-msse2' ;;
            sse42) flags='-msse4.2' ;;
          esac
          make test OBJ_DIR="obj-sanitizers-$variant" \
            CFLAGS="-std=c99 -Isrc $flags --config=./config/clang/sanitizers.cfg" \
            LDFLAGS='--config=./config/clang/sanitizers.cfg'
        done

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        disable_search: true
        files: ./coverage/coverage.info
