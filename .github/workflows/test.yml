name: test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Test Tools (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y llvm

    - name: Setup LLVM Tools (macOS)
      if: runner.os == 'macOS'
      run: |
        TOOLCHAIN_BIN="$(xcrun --find llvm-profdata | xargs dirname)"
        echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

    - name: Run Test with Coverage
      run: make coverage

    - name: Run Native Tests with ASan and UBSan
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        make test table-test OBJ_DIR=obj-sanitizers-native \
          CFLAGS='-std=c99 -Isrc -O1 -g -Wall -Wextra -Werror $(NATIVE_TEST_FLAGS) -fno-omit-frame-pointer -fsanitize=address,undefined' \
          LDFLAGS='-fsanitize=address,undefined'

    - name: Run Parser Variants with ASan and UBSan
      env:
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        variants="scalar"
        case "$(uname -m)" in
          x86_64|amd64) variants="$variants sse2 sse42" ;;
        esac
        for variant in $variants; do
          case "$variant" in
            scalar) flags='-DHWIRE_NO_SIMD' ;;
            sse2) flags='-msse2' ;;
            sse42) flags='-msse4.2' ;;
          esac
          make test OBJ_DIR="obj-sanitizers-$variant" \
            CFLAGS="-std=c99 -Isrc -O1 -g -Wall -Wextra -Werror $flags -fno-omit-frame-pointer -fsanitize=address,undefined" \
            LDFLAGS='-fsanitize=address,undefined'
        done

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        disable_search: true
        files: ./coverage/coverage.info

  fuzz:
    name: Fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Clang and libFuzzer (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev llvm
        echo "/usr/bin" >> "$GITHUB_PATH"

    - name: Set Up LLVM (macOS)
      if: runner.os == 'macOS'
      run: |
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

    - name: Run Bounded Fuzzing
      run: make fuzz-coverage FUZZ_SECONDS=30

    - name: Upload Fuzz Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-coverage-${{ matrix.os }}
        path: tests/fuzz/out/coverage/report/
        if-no-files-found: ignore

    - name: Upload Fuzz Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-logs-${{ matrix.os }}
        path: |
          tests/fuzz/out/**/run.log
          tests/fuzz/out/**/build.log
          tests/fuzz/out/**/coverage-replay.log
        if-no-files-found: ignore

    - name: Upload Fuzz Failure Inputs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-failures-${{ matrix.os }}
        path: tests/fuzz/out/**/artifacts/*
        if-no-files-found: ignore
