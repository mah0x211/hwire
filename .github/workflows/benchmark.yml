name: benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        type: choice
        options: [all, parsers, hashmaps, production]
        default: all
      compare_ref:
        description: Optional branch, tag or commit to measure in the same job
        type: string
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ inputs.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      PYTHONDONTWRITEBYTECODE: '1'
      INSTALL_DEPS: '1'
    steps:
    - name: Checkout measured revision
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Checkout comparison revision
      if: inputs.compare_ref != ''
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.compare_ref }}
        path: .benchmark-comparison
        persist-credentials: false

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang curl

    - name: Measure selected revision
      env:
        BENCH_SUITE: ${{ inputs.suite }}
      run: |
        python3 bench/shared/scripts/actions_benchmark.py \
          --source "$GITHUB_WORKSPACE" --suite "$BENCH_SUITE" --label measured \
          --output "$RUNNER_TEMP/benchmark-results/measured" --summary "$GITHUB_STEP_SUMMARY"

    - name: Measure comparison revision
      if: ${{ !cancelled() && inputs.compare_ref != '' }}
      env:
        BENCH_SUITE: ${{ inputs.suite }}
      run: |
        python3 bench/shared/scripts/actions_benchmark.py \
          --source "$GITHUB_WORKSPACE/.benchmark-comparison" --suite "$BENCH_SUITE" --label comparison \
          --output "$RUNNER_TEMP/benchmark-results/comparison" --summary "$GITHUB_STEP_SUMMARY"

    - name: Upload reports, measurements and logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/benchmark-results/
        if-no-files-found: ignore
