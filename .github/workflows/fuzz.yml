name: fuzz

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target/build
        type: number
        required: true
        default: 60

jobs:
  fuzz:
    name: Fuzz (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 75 || 20 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set Up LLVM
      uses: ./.github/actions/setup-llvm

    - name: Run Bounded Fuzzing
      env:
        FUZZ_SECONDS: ${{ inputs.seconds }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          push) FUZZ_SECONDS=30 ;;
        esac
        case "$FUZZ_SECONDS" in
          ''|*[!0-9]*) echo 'seconds must be a positive integer' >&2; exit 1 ;;
        esac
        make fuzz-coverage FUZZ_SECONDS="$FUZZ_SECONDS"

    - name: Upload Fuzz Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-coverage-${{ matrix.os }}
        path: tests/fuzz/out/coverage/report/
        if-no-files-found: ignore

    - name: Upload Fuzz Logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-logs-${{ matrix.os }}
        path: |
          tests/fuzz/out/**/run.log
          tests/fuzz/out/**/build.log
          tests/fuzz/out/**/coverage-replay.log
        if-no-files-found: ignore

    - name: Upload Fuzz Failure Inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-failures-${{ matrix.os }}
        path: tests/fuzz/out/**/artifacts/*
        if-no-files-found: ignore
