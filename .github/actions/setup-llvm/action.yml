name: Set up LLVM 23
description: Select matching Clang, clang-tidy and LLVM coverage tools.
runs:
  using: composite
  steps:
    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ca-certificates curl gnupg
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
        sudo install -m 644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/apt.llvm.org.asc
        echo 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm-23.list
        sudo apt-get update -qq
        sudo apt-get install -y clang-23 clang-tidy-23 llvm-23 libclang-rt-23-dev
        echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

    - name: Check LLVM tools
      shell: bash
      run: |
        for tool in clang clang-tidy llvm-profdata llvm-cov; do
          version=$("$tool" --version)
          printf '%s\n' "$version"
          if [[ ! "$version" =~ version\ 23\. ]]; then
            echo "Expected LLVM 23: $tool" >&2
            exit 1
          fi
        done
